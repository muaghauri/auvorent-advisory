name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/**

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit httpx2

      - name: Compile Python
        run: python -m compileall -q backend tests

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Frontend injection sink check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.js' --include='*.html' \
            '(^|[^A-Za-z])(innerHTML|outerHTML|insertAdjacentHTML|document\.write|document\.writeln|eval|Function)\s*(=|\()' \
            frontend; then
            echo 'Potential executable DOM/HTML sink detected. Use textContent/createElement/replaceChildren or explicitly reviewed safe rendering.'
            exit 1
          fi
          echo 'No prohibited frontend injection sinks detected.'

      - name: Tracked secret leak check
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files ':!:*.md' ':!:*.lock' ':!:seed/*' ':!:seed/**/*')
          if [ -z "$files" ]; then
            exit 0
          fi
          patterns='BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|postgres(ql)?://[^[:space:]/:]+:[^[:space:]@]+@|(^|[^A-Za-z0-9])AKIA[0-9A-Z]{16}([^A-Za-z0-9]|$)|(^|[^A-Za-z0-9])re_[A-Za-z0-9_-]{20,}([^A-Za-z0-9]|$)'
          if printf '%s\n' "$files" | xargs -r grep -nEI "$patterns"; then
            echo 'Potential credential material is tracked in Git. Remove it and rotate the credential before merge.'
            exit 1
          fi
          echo 'No high-confidence tracked credential patterns detected.'

      - name: Static security scan — blocking medium/high
        run: bandit -q -r backend/app -x backend/alembic -ll

      - name: Static security scan — informational low findings
        continue-on-error: true
        run: bandit -q -r backend/app -x backend/alembic -l

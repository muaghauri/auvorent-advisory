name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/**

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit

      - name: Compile Python
        run: python -m compileall -q backend tests

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Static security scan
        run: bandit -q -r backend/app -x backend/alembic

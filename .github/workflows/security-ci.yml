name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/**

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit httpx2

      - name: Compile Python
        run: python -m compileall -q backend tests

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Frontend injection sink check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.js' --include='*.html' \
            '(^|[^A-Za-z])(innerHTML|outerHTML|insertAdjacentHTML|document\.write|document\.writeln|eval|Function)\s*(=|\()' \
            frontend; then
            echo 'Potential executable DOM/HTML sink detected. Use textContent/createElement/replaceChildren or explicitly reviewed safe rendering.'
            exit 1
          fi
          echo 'No prohibited frontend injection sinks detected.'

      - name: Static security scan — blocking medium/high
        run: bandit -q -r backend/app -x backend/alembic -ll

      - name: Static security scan — informational low findings
        continue-on-error: true
        run: bandit -q -r backend/app -x backend/alembic -l
